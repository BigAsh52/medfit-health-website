<svg viewBox="0 0 200 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBF5FB"/>
      <stop offset="1" stop-color="#F7F9FC"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#F3F6FA"/>
      <stop offset="1" stop-color="#E3E9F0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200" height="290" fill="url(#bg)" rx="14"/>
  <!-- cap -->
  <rect x="70" y="30" width="60" height="24" rx="4" fill="#EC4899"/>
  <rect x="70" y="50" width="60" height="7" fill="#EC4899" opacity="0.6"/>
  <!-- bottle body -->
  <rect x="45" y="57" width="110" height="213" rx="16" fill="url(#bottle)" stroke="#DDE4EE" stroke-width="1.5"/>
  <!-- Rx symbol -->
  <text x="100" y="98" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="24" font-weight="600" fill="#EC4899" opacity="0.85">Rx</text>
  <!-- label -->
  <rect x="52" y="130" width="96" height="128" rx="6" fill="#ffffff" stroke="#EC4899" stroke-width="1.5"/>
  <rect x="52" y="130" width="96" height="16" rx="6" fill="#EC4899"/>
  <rect x="52" y="140" width="96" height="6" fill="#EC4899"/>
  <text x="100" y="141.5" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="700" letter-spacing="0.8" fill="#ffffff">MEDFIT HEALTH</text>
  <text x="100" y="170" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="15.5" font-weight="600" fill="#0B1E32">Lust</text>
  <text x="100" y="193" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4A5568">Flibanserin 90mg /</text><text x="100" y="206" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4A5568">Oxytocin 100iu /</text><text x="100" y="219" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4A5568">Tyrosine 50mg</text>
  <text x="100" y="246" text-anchor="middle" font-family="Inter,sans-serif" font-size="8.5" fill="#718096">Rapid Dissolve Tablet (RDT)</text>
</svg>