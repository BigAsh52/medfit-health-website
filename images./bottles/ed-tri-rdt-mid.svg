  <text x="100" y="170" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="15.5" font-weight="600" fill="#0B1E32">Tri RDT — Mid</text><text x="100" y="189" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="15.5" font-weight="600" fill="#0B1E32">Strength</text>
  <text x="100" y="212" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4A5568">Apomorphine 2mg /</text><text x="100" y="225" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4A5568">Sildenafil 65mg /</text><text x="100" y="238" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#4A5568">Tadalafil 14mg</text>
