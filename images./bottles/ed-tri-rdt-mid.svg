    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#F3F6FA"/>
      <stop offset="1" stop-color="#E3E9F0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200" height="309" fill="url(#bg)" rx="14"/>
